name: Build APK

# Every push / PR builds a signed APK and keeps it as a workflow artifact.
# Pushing a tag vX.Y.Z[.N] also publishes it as a GitHub release asset named
# portal-ha-bridge.apk — the name the in-app updater and provision scripts look for.
#
# Signing secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of the PKCS12 / JKS keystore
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password (same as the store password for PKCS12)

on:
  push:
    branches: [universal]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.6'   # matches gradle/wrapper/gradle-wrapper.properties

      - name: Write signing config
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk portal-ha-bridge.apk
          else
            EXTRA=""
            case "$GITHUB_REF" in
              refs/tags/v*) EXTRA="-PversionNameOverride=${GITHUB_REF_NAME#v}" ;;
            esac
            gradle --no-daemon :app:assembleRelease $EXTRA
            cp app/build/outputs/apk/release/app-release.apk portal-ha-bridge.apk
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: portal-ha-bridge-${{ github.sha }}
          path: portal-ha-bridge.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" portal-ha-bridge.apk \
            --title "$GITHUB_REF_NAME" --generate-notes
